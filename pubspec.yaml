name: daily_mind
description: "Daily Mind: short daily learning instead of endless scrolling."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  connectivity_plus: ^7.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  screen_time:
    path: packages/screen_time
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
