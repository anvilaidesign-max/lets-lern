<line x1="330" y1="158" x2="330" y2="176" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><rect x="280" y="178" width="100" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="330" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">EAC</text><text x="330" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">East</text>
<line x1="455" y1="158" x2="455" y2="176" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><rect x="405" y="178" width="100" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="455" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">ECOWAS</text><text x="455" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">West</text>
<line x1="580" y1="158" x2="580" y2="176" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><rect x="530" y="178" width="100" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="580" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">ECCAS</text><text x="580" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">Central</text>
<line x1="705" y1="158" x2="705" y2="176" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><rect x="655" y="178" width="100" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="705" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">IGAD</text><text x="705" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">Horn</text>
<text x="560" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Zimbabwe belongs to the highlighted ones</text>
<rect x="160" y="300" width="480" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="400" y="338" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">AfCFTA: African Continental Free Trade Area</text><text x="400" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">one market of about 1.4 billion people · trading since 2021</text>
<line x1="250" y1="250" x2="250" y2="284" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><polygon points="250,296 243.4,284 256.6,284" fill="#2563EB" stroke="none" stroke-width="0"/>
<text x="400" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Goal: lower tariffs and barriers so Africa trades more with itself.</text>
