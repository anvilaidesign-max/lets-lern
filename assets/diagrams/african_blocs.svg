<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Africa's institutions</text>
<rect x="250" y="62" width="300" height="72" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="400" y="96" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">African Union</text><text x="400" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#64748B" text-anchor="middle">55 member states · Addis Ababa</text>
<line x1="400" y1="134" x2="400" y2="158" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="80" y1="158" x2="720" y2="158" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="80" y1="158" x2="80" y2="176" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><rect x="30" y="178" width="100" height="70" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><text x="80" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">SADC</text><text x="80" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">Southern</text>
