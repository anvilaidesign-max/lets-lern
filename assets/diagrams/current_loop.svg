<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">The 4–20 mA current loop</text>
<rect x="40" y="110" width="160" height="110" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="120" y="161" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">24 V DC</text><text x="120" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">supply</text>
<rect x="560" y="90" width="200" height="120" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/><text x="660" y="137" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Pressure</text><text x="660" y="159" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">transmitter</text><text x="660" y="183" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">0–10 bar</text>
<rect x="330" y="250" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="415" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">PLC analogue</text><text x="415" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">input</text><text x="415" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">250 Ω → 1–5 V</text>
<line x1="200" y1="140" x2="560" y2="140" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="140" x2="388" y2="140" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><polygon points="400,140 388,146.6 388,133.4" fill="#DC2626" stroke="none" stroke-width="0"/>
<line x1="660" y1="210" x2="660" y2="295" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<line x1="660" y1="295" x2="500" y2="295" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="295" x2="120" y2="295" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<line x1="120" y1="295" x2="120" y2="220" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<text x="400" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#DC2626" text-anchor="middle">same current everywhere in the loop</text>
<rect x="60" y="375" width="400" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
<line x1="260" y1="372" x2="260" y2="400" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">4 mA = 0%</text>
<text x="260" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">12 mA = 50%</text>
<text x="460" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="end">20 mA = 100%</text>
<text x="640" y="395" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#DC2626" text-anchor="middle">0 mA = broken wire!</text>
<text x="640" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">live zero makes faults visible</text>
</svg>
