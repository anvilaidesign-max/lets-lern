<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Risk and return go together</text>
<line x1="90" y1="360" x2="658" y2="360" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="670,360 658,366.6 658,353.4" fill="#334155" stroke="none" stroke-width="0"/>
<line x1="90" y1="360" x2="90" y2="68" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="90,56 96.6,68 83.4,68" fill="#334155" stroke="none" stroke-width="0"/>
<text x="370" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">risk: how much the value swings</text>
<text x="50" y="215" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748B" text-anchor="middle" transform="rotate(-90 50 215)">expected long-run return</text>
<line x1="110" y1="350" x2="640" y2="90" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="118" cy="336.8" r="13" fill="#64748B" stroke="#FFFFFF" stroke-width="3"/><text x="138" y="341.8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">Cash savings</text><circle cx="190.8" cy="302" r="13" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/><text x="210.8" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">Government bonds</text><circle cx="258" cy="273" r="13" fill="#0D9488" stroke="#FFFFFF" stroke-width="3"/><text x="278" y="278" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">Corporate bonds</text><circle cx="342" cy="229.5" r="13" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/><text x="362" y="234.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">Property</text><circle cx="426" cy="186" r="13" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/><text x="406" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="end">Share index fund</text><circle cx="538" cy="186" r="13" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><text x="558" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="start">Single company</text><circle cx="610.8000000000001" cy="113.5" r="13" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/><text x="590.8000000000001" y="118.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="end">Startups</text>
<rect x="560" y="380" width="225" height="56" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/>
<text x="672" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">One company: more risk,</text>
<text x="672" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">no extra reward. Diversify.</text>
</svg>
