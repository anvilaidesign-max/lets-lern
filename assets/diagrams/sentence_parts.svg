<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">The parts of a sentence</text>
<rect x="30" y="90" width="170" height="54" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="115" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">The engineer</text><line x1="115" y1="146" x2="115" y2="168" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/><text x="115" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">subject</text>
<rect x="210" y="90" width="110" height="54" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="265" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">tested</text><line x1="265" y1="146" x2="265" y2="168" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="265" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">verb</text>
<rect x="330" y="90" width="190" height="54" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="425" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">the new circuit</text><line x1="425" y1="146" x2="425" y2="168" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/><text x="425" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">object</text>
<rect x="530" y="90" width="120" height="54" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="590" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">carefully</text><line x1="590" y1="146" x2="590" y2="168" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/><text x="590" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">adverb</text>
<rect x="660" y="90" width="110" height="54" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="715" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">today.</text><line x1="715" y1="146" x2="715" y2="168" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/><text x="715" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#F97316" text-anchor="middle">time</text>
<text x="400" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Who did it? · What happened? · To what? · How? · When?</text>
<rect x="30" y="256" width="740" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>
<text x="50" y="288" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="start">Simple:</text>
<text x="160" y="288" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start">The motor stopped.</text>
<text x="50" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#F97316" text-anchor="start">Compound:</text>
<text x="160" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start">The motor stopped, and the alarm sounded.</text>
<text x="160" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start">two main clauses joined by and, but, or, so</text>
<text x="50" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="start">Complex:</text>
<text x="160" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start">When the fuse blew, the motor stopped.</text>
<text x="160" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start">a dependent clause (when, because, although) + a main clause</text>
</svg>
