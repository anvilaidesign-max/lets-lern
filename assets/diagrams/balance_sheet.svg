<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">The balance sheet always balances</text>
<text x="210" y="80" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">What the company OWNS</text>
<text x="590" y="80" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#7C3AED" text-anchor="middle">Where the money CAME FROM</text>
<rect x="90" y="95" width="240" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="210" y="133" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Cash</text><text x="210" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">and money owed by customers</text>
<rect x="90" y="180" width="240" height="70" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="210" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Stock</text><text x="210" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">goods not yet sold</text>
<rect x="90" y="255" width="240" height="110" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="210" y="308" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Equipment, buildings</text><text x="210" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">long-term assets</text>
<rect x="470" y="95" width="240" height="120" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="590" y="153" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Liabilities</text><text x="590" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">loans, unpaid suppliers</text>
<rect x="470" y="220" width="240" height="145" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="590" y="290.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Equity</text><text x="590" y="313.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">owners' money + kept profits</text>
<text x="400" y="240" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#0F172A" text-anchor="middle">=</text>
<text x="210" y="395" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563EB" text-anchor="middle">Assets</text>
<text x="590" y="395" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#7C3AED" text-anchor="middle">Liabilities + Equity</text>
<text x="400" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">A snapshot on one day. Profit over the year adds to equity.</text>
</svg>
