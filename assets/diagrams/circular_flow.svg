<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">The circular flow of the economy</text>
<rect x="40" y="180" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="135" y="223" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Households</text><text x="135" y="249" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#64748B" text-anchor="middle">people</text>
<rect x="570" y="180" width="190" height="90" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="665" y="223" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Firms</text><text x="665" y="249" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#64748B" text-anchor="middle">businesses</text>
<path d="M135,176 C135,80 665,80 665,176" stroke="#16A34A" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="665,178 657,162 673,162" fill="#16A34A" stroke="none" stroke-width="0"/>
<text x="400" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">spending on goods and services (money)</text>
<path d="M640,176 C640,118 160,118 160,176" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/>
<polygon points="160,178 152,162 168,162" fill="#7C3AED" stroke="none" stroke-width="0"/>
<text x="400" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#7C3AED" text-anchor="middle">goods and services</text>
<path d="M665,274 C665,370 135,370 135,274" stroke="#16A34A" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="135,272 127,288 143,288" fill="#16A34A" stroke="none" stroke-width="0"/>
<text x="400" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">wages, rent, profits (money)</text>
<path d="M160,274 C160,330 640,330 640,274" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/>
<polygon points="640,272 632,288 648,288" fill="#7C3AED" stroke="none" stroke-width="0"/>
<text x="400" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#7C3AED" text-anchor="middle">labour, land, capital</text>
<rect x="300" y="195" width="200" height="60" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><text x="400" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Government, banks, trade</text><text x="400" y="243" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#64748B" text-anchor="middle">taxes, loans, exports</text>
<text x="400" y="425" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">GDP = C + I + G + (X − M): one economy's spending, measured once.</text>
</svg>
