<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Au café: a real conversation</text>
<rect x="40" y="62" width="520" height="62" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="58" y="89" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start">Bonjour madame ! Je voudrais un café, s'il vous plaît.</text><text x="58" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">Hello! I'd like a coffee, please.</text><rect x="240" y="138" width="520" height="62" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="258" y="165" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start">Bien sûr. Sur place ou à emporter ?</text><text x="258" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">Of course. Here or to take away?</text><rect x="40" y="214" width="520" height="62" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="58" y="241" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start">Sur place. C'est combien ?</text><text x="58" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">Here. How much is it?</text><rect x="240" y="290" width="520" height="62" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="258" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start">Deux euros cinquante.</text><text x="258" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">Two euros fifty.</text><rect x="40" y="366" width="520" height="62" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="58" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="start">Voilà. Merci, bonne journée !</text><text x="58" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">Here you are. Thanks, have a good day!</text>
</svg>
