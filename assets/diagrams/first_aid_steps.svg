<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">First steps in an emergency: DRSABC</text>
<rect x="30" y="90" width="112" height="150" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><circle cx="86" cy="132" r="26" fill="#DC2626" stroke="#DC2626" stroke-width="3"/><text x="86" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D</text><text x="86" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Danger</text><text x="86" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">make it safe</text><line x1="142" y1="165" x2="142" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/><polygon points="154,165 142,171.6 142,158.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="155" y="90" width="112" height="150" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><circle cx="211" cy="132" r="26" fill="#F97316" stroke="#F97316" stroke-width="3"/><text x="211" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text><text x="211" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Response</text><text x="211" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">talk, tap</text><line x1="267" y1="165" x2="267" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/><polygon points="279,165 267,171.6 267,158.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="280" y="90" width="112" height="150" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><circle cx="336" cy="132" r="26" fill="#EAB308" stroke="#EAB308" stroke-width="3"/><text x="336" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">S</text><text x="336" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Send</text><text x="336" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">call for help</text><line x1="392" y1="165" x2="392" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/><polygon points="404,165 392,171.6 392,158.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="405" y="90" width="112" height="150" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><circle cx="461" cy="132" r="26" fill="#16A34A" stroke="#16A34A" stroke-width="3"/><text x="461" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text><text x="461" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Airway</text><text x="461" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">tilt head, lift chin</text><line x1="517" y1="165" x2="517" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/><polygon points="529,165 517,171.6 517,158.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="530" y="90" width="112" height="150" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/><circle cx="586" cy="132" r="26" fill="#0D9488" stroke="#0D9488" stroke-width="3"/><text x="586" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text><text x="586" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Breathing</text><text x="586" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">look, listen, feel</text><line x1="642" y1="165" x2="642" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/><polygon points="654,165 642,171.6 642,158.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="655" y="90" width="112" height="150" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><circle cx="711" cy="132" r="26" fill="#2563EB" stroke="#2563EB" stroke-width="3"/><text x="711" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text><text x="711" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">CPR</text><text x="711" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">if not breathing</text>
<rect x="40" y="275" width="720" height="145" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>
<text x="400" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">CPR for adults</text>
<text x="220" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">centre of the chest</text>
<text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">5–6 cm deep</text>
<text x="580" y="350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">100–120 per minute</text>
<text x="400" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Use an AED as soon as one arrives. Hands-only CPR is far better than nothing.</text>
</svg>
