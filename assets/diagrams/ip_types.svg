<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Four ways to protect ideas</text>
<rect x="24" y="70" width="176" height="300" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><circle cx="112" cy="125" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/><text x="112" y="136" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#2563EB" text-anchor="middle">P</text><text x="112" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Patent</text><text x="112" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Protects</text><text x="112" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">inventions</text><text x="112" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">How</text><text x="112" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">must register</text><text x="112" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Lasts</text><text x="112" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">about 20 years</text>
<rect x="216" y="70" width="176" height="300" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><circle cx="304" cy="125" r="34" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/><text x="304" y="136" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#7C3AED" text-anchor="middle">©</text><text x="304" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Copyright</text><text x="304" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Protects</text><text x="304" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">code, books, music</text><text x="304" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">How</text><text x="304" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">automatic</text><text x="304" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Lasts</text><text x="304" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">decades after death</text>
<rect x="408" y="70" width="176" height="300" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><circle cx="496" cy="125" r="34" fill="#FFFFFF" stroke="#F97316" stroke-width="4"/><text x="496" y="136" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#F97316" text-anchor="middle">™</text><text x="496" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Trademark</text><text x="496" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Protects</text><text x="496" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">names and logos</text><text x="496" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">How</text><text x="496" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">register to be safe</text><text x="496" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Lasts</text><text x="496" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">renewable forever</text>
<rect x="600" y="70" width="176" height="300" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><circle cx="688" cy="125" r="34" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="688" y="136" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#16A34A" text-anchor="middle">S</text><text x="688" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Trade secret</text><text x="688" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Protects</text><text x="688" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">recipes, know-how</text><text x="688" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">How</text><text x="688" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">keep it secret</text><text x="688" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">Lasts</text><text x="688" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">as long as secret</text>
<text x="400" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Code is protected by copyright automatically; a new technical method may be patentable.</text>
</svg>
