<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">A criminal case, step by step</text>
<rect x="22" y="80" width="136" height="76" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="90" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Arrest</text><text x="90" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">told the reason</text><line x1="158" y1="118" x2="163" y2="118" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="175,118 163,124.6 163,111.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="177" y="80" width="136" height="76" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="245" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Court in 48 h</text><text x="245" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">bail is the norm</text><line x1="313" y1="118" x2="318" y2="118" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="330,118 318,124.6 318,111.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="332" y="80" width="136" height="76" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="400" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Trial</text><text x="400" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">state proves guilt</text><line x1="468" y1="118" x2="473" y2="118" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="485,118 473,124.6 473,111.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="487" y="80" width="136" height="76" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="555" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Verdict</text><text x="555" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">guilty or not</text><line x1="623" y1="118" x2="628" y2="118" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="640,118 628,124.6 628,111.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="642" y="80" width="136" height="76" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="710" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Appeal</text><text x="710" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">higher court</text>
<text x="400" y="205" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">How sure must the court be?</text>
<text x="60" y="250" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="start">Civil case</text>
<rect x="200" y="234" width="520" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2.5"/>
<rect x="200" y="234" width="275" height="24" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
<text x="488" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0D9488" text-anchor="start">more likely than not (&gt; 50%)</text>
<text x="60" y="305" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="start">Criminal case</text>
<rect x="200" y="289" width="520" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2.5"/>
<rect x="200" y="289" width="500" height="24" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
<text x="450" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">beyond reasonable doubt</text>
<rect x="80" y="350" width="640" height="70" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/>
<text x="400" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Presumed innocent until proven guilty</text>
<text x="400" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">The accused never has to prove innocence.</text>
</svg>
