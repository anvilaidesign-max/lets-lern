<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Zimbabwe's courts</text>
<rect x="270" y="62" width="260" height="58" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="400" y="89" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Constitutional Court</text><text x="400" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">final say on the Constitution</text>
<rect x="220" y="132" width="360" height="58" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="400" y="159" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Supreme Court</text><text x="400" y="183" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">final court of appeal</text>
<rect x="90" y="202" width="280" height="58" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/><text x="230" y="229" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">High Court</text><text x="230" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">serious cases, appeals, reviews</text>
<rect x="385" y="202" width="160" height="58" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/><text x="465" y="229" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Labour Court</text><text x="465" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">employment</text>
<rect x="560" y="202" width="170" height="58" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/><text x="645" y="229" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Administrative</text><text x="645" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">tax, licences, land</text>
<rect x="90" y="272" width="640" height="58" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="410" y="299" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Magistrates' courts</text><text x="410" y="323" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">most criminal and civil cases start here</text>
<rect x="90" y="342" width="640" height="58" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><text x="410" y="369" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Local courts (chiefs and headmen)</text><text x="410" y="393" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">customary law disputes</text>
<line x1="50" y1="390" x2="50" y2="96" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><polygon points="50,80 58.8,96 41.2,96" fill="#DC2626" stroke="none" stroke-width="0"/>
<text x="30" y="235" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle" transform="rotate(-90 30 235)">appeals go up</text>
<text x="400" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Specialised courts sit alongside the High Court; appeals from them go to the Supreme Court.</text>
</svg>
