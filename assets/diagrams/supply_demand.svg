<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Supply and demand</text>
<line x1="90" y1="370" x2="538" y2="370" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="550,370 538,376.6 538,363.4" fill="#334155" stroke="none" stroke-width="0"/>
<line x1="90" y1="370" x2="90" y2="68" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><polygon points="90,56 96.6,68 83.4,68" fill="#334155" stroke="none" stroke-width="0"/>
<text x="546" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="end">quantity</text>
<text x="78" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="end">price</text>
<line x1="134" y1="340" x2="486" y2="100" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
<text x="494.8" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="start">Supply</text>
<line x1="134" y1="100" x2="486" y2="340" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
<text x="494.8" y="349" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="start">Demand</text>
<line x1="178" y1="70" x2="508" y2="295" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="178" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#DC2626" text-anchor="start">Demand rises</text>
<line x1="248.4" y1="190" x2="282.4852718863094" y2="166.76004189569812" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><polygon points="292.4,160 286.2,172.2 278.8,161.3" fill="#DC2626" stroke="none" stroke-width="0"/>
<line x1="310" y1="220" x2="310" y2="370" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="90" y1="220" x2="310" y2="220" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="354" y1="190" x2="354" y2="370" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="90" y1="190" x2="354" y2="190" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="310" cy="220" r="8" fill="#0F172A"/>
<circle cx="354" cy="190" r="8" fill="#16A34A"/>
<text x="82" y="225" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="end">P₁</text>
<text x="82" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="end">P₂</text>
<text x="310" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Q₁</text>
<text x="354" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">Q₂</text>
<rect x="580" y="90" width="200" height="260" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>
<text x="680" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Equilibrium</text>
<text x="680" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">where the curves cross</text>
<text x="680" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">If demand rises:</text>
<text x="680" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle">price goes up</text>
<text x="680" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle">quantity goes up</text>
<text x="680" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Price set too low?</text>
<text x="680" y="304" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle">shortages and</text>
<text x="680" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="middle">empty shelves</text>
</svg>
