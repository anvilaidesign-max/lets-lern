<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">How startups raise money</text>
<rect x="30" y="270" width="112" height="60" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><text x="86" y="296" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Pre-seed</text><text x="86" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">idea, team</text><text x="86" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">100%</text><rect x="155" y="236" width="112" height="94" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="211" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Seed</text><text x="211" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">first product</text><text x="211" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">80%</text><rect x="280" y="202" width="112" height="128" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="336" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Series A</text><text x="336" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">it works: scale</text><text x="336" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">64%</text><rect x="405" y="168" width="112" height="162" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="461" y="194" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Series B</text><text x="461" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">expand fast</text><text x="461" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">51%</text><rect x="530" y="134" width="112" height="196" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="586" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Series C+</text><text x="586" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">dominate</text><text x="586" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">43%</text><rect x="655" y="100" width="112" height="230" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="711" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Exit</text><text x="711" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">sale or IPO</text><line x1="40" y1="70" x2="158" y2="70" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/><polygon points="170,70 158,76.6 158,63.4" fill="#16A34A" stroke="none" stroke-width="0"/><text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="start">valuation rises each round if you grow</text><line x1="30" y1="330" x2="770" y2="330" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/><text x="30" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start">Founders' stake after each round:</text><text x="400" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Each round sells about 20% of the company: founders own less of something far more valuable.</text><text x="400" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">(illustrative numbers)</text>
</svg>
