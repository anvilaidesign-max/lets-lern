<path d="M296,228 A1,1 0 0,0 208,184" stroke="#64748B" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/>
<rect x="470" y="90" width="310" height="300" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/>
<text x="625" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">R = [ 0  −1 ]</text>
<text x="625" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">      [ 1   0 ]</text>
<text x="625" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">Rv = (0·3 + (−1)·1, 1·3 + 0·1)</text>
<text x="625" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#F97316" text-anchor="middle">= (−1, 3)</text>
<text x="625" y="280" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="middle">det R = 0·0 − (−1)·1 = 1</text>
<text x="625" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">area is preserved</text>
<text x="625" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">rows × columns, order matters</text>
