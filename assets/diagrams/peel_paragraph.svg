<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Build a strong paragraph: PEEL</text>
<rect x="30" y="64" width="740" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><rect x="44" y="78" width="52" height="52" rx="10" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/><text x="70" y="114" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text><text x="112" y="96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start">Point</text><text x="220" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="start">State your main idea in one sentence.</text><text x="112" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">e.g. "Solar power suits rural clinics."</text>
<rect x="30" y="156" width="740" height="80" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><rect x="44" y="170" width="52" height="52" rx="10" fill="#F97316" stroke="#F97316" stroke-width="2.5"/><text x="70" y="206" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">E</text><text x="112" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start">Evidence</text><text x="220" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="start">Give facts, data, examples or a source.</text><text x="112" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">e.g. "It needs no grid and runs fridges for vaccines."</text>
<rect x="30" y="248" width="740" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><rect x="44" y="262" width="52" height="52" rx="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="2.5"/><text x="70" y="298" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">E</text><text x="112" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start">Explain</text><text x="220" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="start">Show how the evidence proves the point.</text><text x="112" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">e.g. "So clinics can store medicine despite load-shedding."</text>
<rect x="30" y="340" width="740" height="80" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><rect x="44" y="354" width="52" height="52" rx="10" fill="#16A34A" stroke="#16A34A" stroke-width="2.5"/><text x="70" y="390" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L</text><text x="112" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start">Link</text><text x="220" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F172A" text-anchor="start">Connect back to your argument or the next idea.</text><text x="112" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">e.g. "This is why solar should come first in rural plans."</text>
</svg>
