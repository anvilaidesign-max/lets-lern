<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">How states get what they want</text>
<rect x="40" y="90" width="720" height="30" rx="15" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2.5"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#DC2626"/><stop offset="0.5" stop-color="#EAB308"/><stop offset="1" stop-color="#16A34A"/></linearGradient></defs>
<rect x="40" y="90" width="720" height="30" rx="15" fill="url(#g)"/>
<text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="start">Hard power: coerce</text>
<text x="760" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="end">Soft power: attract</text>
<line x1="100" y1="122" x2="100" y2="150" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><text x="100" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Military force</text>
<line x1="235" y1="122" x2="235" y2="150" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><text x="235" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Sanctions</text>
<line x1="390" y1="122" x2="390" y2="150" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><text x="390" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Aid and trade deals</text>
<line x1="540" y1="122" x2="540" y2="150" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><text x="540" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Diplomacy</text>
<line x1="685" y1="122" x2="685" y2="150" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><text x="685" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Culture, ideas, education</text>
<text x="400" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Three ways to explain world politics</text>
<rect x="40" y="240" width="230" height="150" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="155" y="313" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">Realism</text><text x="155" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">power and security first</text>
<rect x="285" y="240" width="230" height="150" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="400" y="313" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">Liberalism</text><text x="400" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">trade and institutions help</text>
<rect x="530" y="240" width="230" height="150" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="645" y="313" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">Constructivism</text><text x="645" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">ideas and identity matter</text>
<text x="400" y="425" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Most real events need more than one lens to explain.</text>
</svg>
