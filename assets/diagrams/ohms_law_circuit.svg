<text x="675" y="290" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#0F172A" text-anchor="middle">R</text>
<text x="630" y="360" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">Cover the one you want:</text>
<text x="630" y="386" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">V = I × R   I = V ÷ R   R = V ÷ I</text>
