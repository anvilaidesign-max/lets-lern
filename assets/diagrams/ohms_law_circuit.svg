<polygon points="630,110 510,320 750,320" fill="#FFEDD5" stroke="#F97316" stroke-width="3"/>
<line x1="569" y1="216" x2="691" y2="216" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
