<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">What makes a valid contract</text>
<rect x="30" y="70" width="130" height="52" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="95" y="102.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Offer</text>
<text x="185" y="104" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0F172A" text-anchor="middle">+</text>
<rect x="210" y="70" width="150" height="52" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="285" y="102.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Acceptance</text>
<line x1="362" y1="96" x2="388" y2="96" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="400,96 388,102.6 388,89.4" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="402" y="70" width="150" height="52" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="477" y="102.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">Agreement</text>
<rect x="30" y="158" width="170" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="115" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Serious intention</text>
<rect x="222" y="158" width="170" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="307" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Capacity (18+)</text>
<rect x="414" y="158" width="170" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="499" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Lawful and possible</text>
<rect x="606" y="158" width="170" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5"/><text x="691" y="185.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Formalities if any</text>
<text x="400" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">plus all of these</text>
<path d="M115,202 L115,222 L691,222 L691,202" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="307" y1="202" x2="307" y2="222" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="499" y1="202" x2="499" y2="222" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="400" y1="222" x2="400" y2="238" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="400,250 393.4,238 406.6,238" fill="#334155" stroke="none" stroke-width="0"/>
<rect x="280" y="252" width="240" height="54" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="400" y="286.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">Valid contract</text>
<text x="400" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">If one side breaks it, the other may claim:</text>
<rect x="60" y="358" width="210" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="165" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Specific performance</text><text x="165" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">do what you promised</text>
<rect x="295" y="358" width="210" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="400" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Damages</text><text x="400" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">money for the loss</text>
<rect x="530" y="358" width="210" height="58" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="635" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Cancellation</text><text x="635" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">if the breach is serious</text>
</svg>
