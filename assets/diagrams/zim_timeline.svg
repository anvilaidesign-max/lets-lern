<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Zimbabwe: key moments</text>
<line x1="80" y1="240" x2="720" y2="240" stroke="#334155" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="240" r="11" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/><line x1="80" y1="226" x2="80" y2="178" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/><text x="80" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#F97316" text-anchor="middle">1100s–1400s</text><text x="80" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Great Zimbabwe</text><circle cx="160" cy="240" r="11" fill="#64748B" stroke="#FFFFFF" stroke-width="3"/><line x1="160" y1="254" x2="160" y2="302" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><text x="160" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#64748B" text-anchor="middle">1890</text><text x="160" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Colonial rule</text><circle cx="240" cy="240" r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/><line x1="240" y1="226" x2="240" y2="178" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="240" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">1896–97</text><text x="240" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">First Chimurenga</text><circle cx="320" cy="240" r="11" fill="#64748B" stroke="#FFFFFF" stroke-width="3"/><line x1="320" y1="254" x2="320" y2="302" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/><text x="320" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#64748B" text-anchor="middle">1965</text><text x="320" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Smith's UDI</text><circle cx="400" cy="240" r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/><line x1="400" y1="226" x2="400" y2="178" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><text x="400" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">1966–79</text><text x="400" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Liberation war</text><circle cx="480" cy="240" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/><line x1="480" y1="254" x2="480" y2="302" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/><text x="480" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">1980</text><text x="480" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Independence</text><circle cx="560" cy="240" r="11" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/><line x1="560" y1="226" x2="560" y2="178" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/><text x="560" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#F97316" text-anchor="middle">2008</text><text x="560" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Hyperinflation</text><circle cx="640" cy="240" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/><line x1="640" y1="254" x2="640" y2="302" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/><text x="640" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="middle">2013</text><text x="640" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">New constitution</text><circle cx="720" cy="240" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><line x1="720" y1="226" x2="720" y2="178" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/><text x="720" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">2017</text><text x="720" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">Mugabe resigns</text>
<text x="400" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">18 April 1980: Southern Rhodesia becomes independent Zimbabwe.</text>
</svg>
