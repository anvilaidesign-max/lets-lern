<text x="337" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#2563EB" text-anchor="middle">ventricle</text>
<rect x="405" y="160" width="115" height="80" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
