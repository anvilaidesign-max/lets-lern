<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">The heart: two pumps, two circuits</text>
<rect x="300" y="60" width="200" height="55" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/><text x="400" y="85.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Lungs</text><text x="400" y="109.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="middle">pick up O₂, drop CO₂</text>
