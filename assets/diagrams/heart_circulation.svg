<text x="462" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#DC2626" text-anchor="middle">atrium</text>
<rect x="405" y="245" width="115" height="90" rx="12" fill="#FECACA" stroke="#DC2626" stroke-width="4"/>
<text x="462" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Left</text>
<text x="462" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#DC2626" text-anchor="middle">ventricle</text>
<path d="M280,300 C200,300 200,90 298,90" stroke="#2563EB" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
