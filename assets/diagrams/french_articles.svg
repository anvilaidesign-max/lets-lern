<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">French articles at a glance</text>
<rect x="220" y="64" width="170" height="40" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="305" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2563EB" text-anchor="middle">Masculine</text><rect x="405" y="64" width="170" height="40" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="490" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#DC2626" text-anchor="middle">Feminine</text><rect x="590" y="64" width="170" height="40" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="675" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#7C3AED" text-anchor="middle">Plural</text><text x="200" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="end">the</text><rect x="220" y="116" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="305" y="149" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">le livre</text><rect x="405" y="116" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="490" y="149" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">la table</text><rect x="590" y="116" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="675" y="149" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">les livres</text><text x="590" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">l' before a vowel: l'ami, l'école</text><text x="200" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="end">a / some</text><rect x="220" y="194" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="305" y="227" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">un livre</text><rect x="405" y="194" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="490" y="227" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">une table</text><rect x="590" y="194" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="675" y="227" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">des livres</text><text x="200" y="306" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="end">some (part of)</text><rect x="220" y="272" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="305" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">du pain</text><rect x="405" y="272" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="490" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">de la bière</text><rect x="590" y="272" width="170" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5"/><text x="675" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="middle">des pâtes</text><text x="590" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">de l' before a vowel: de l'eau</text><rect x="40" y="356" width="720" height="74" rx="12" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/><text x="400" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Contractions:  à + le = au   ·   à + les = aux   ·   de + le = du   ·   de + les = des</text><text x="400" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Je vais au marché. · Le prix du pain. · Après la négation: pas de pain.</text>
</svg>
