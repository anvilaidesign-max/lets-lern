<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">French tenses on a timeline</text>
<line x1="70" y1="210" x2="732" y2="210" stroke="#334155" stroke-width="5" stroke-linecap="round"/><polygon points="750,210 732,219.9 732,200.1" fill="#334155" stroke="none" stroke-width="0"/><text x="70" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="start">past</text><text x="730" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="end">future</text><circle cx="136" cy="210" r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/><line x1="136" y1="196" x2="136" y2="176" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/><rect x="58" y="82" width="156" height="94" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/><text x="136" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">Passé composé</text><text x="136" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">J'ai mangé.</text><text x="136" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">a finished action</text><circle cx="254.8" cy="210" r="11" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/><line x1="254.8" y1="224" x2="254.8" y2="266" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/><rect x="176.8" y="266" width="156" height="94" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2.5"/><text x="254.8" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#F97316" text-anchor="middle">Imparfait</text><text x="254.8" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Je mangeais.</text><text x="254.8" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">background, habits</text><circle cx="400" cy="210" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/><line x1="400" y1="196" x2="400" y2="176" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/><rect x="322" y="82" width="156" height="94" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5"/><text x="400" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#16A34A" text-anchor="middle">Présent</text><text x="400" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Je mange.</text><text x="400" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">now, general truths</text><circle cx="545.2" cy="210" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/><line x1="545.2" y1="224" x2="545.2" y2="266" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/><rect x="467.20000000000005" y="266" width="156" height="94" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="545.2" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Futur proche</text><text x="545.2" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Je vais manger.</text><text x="545.2" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">soon, planned</text><circle cx="664" cy="210" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><line x1="664" y1="196" x2="664" y2="176" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/><rect x="586" y="82" width="156" height="94" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/><text x="664" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED" text-anchor="middle">Futur simple</text><text x="664" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Je mangerai.</text><text x="664" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">later, predictions</text><text x="400" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">Hier, il pleuvait (imparfait) quand j'ai pris le bus (passé composé).</text>
</svg>
