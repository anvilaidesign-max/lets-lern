<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect x="0" y="0" width="800" height="450" rx="18" fill="#FFFFFF"/>
<text x="400" y="38" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F172A" text-anchor="middle">Porter's five forces</text>
<rect x="290" y="180" width="220" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><text x="400" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Rivalry among</text><text x="400" y="243" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">competitors</text>
<rect x="290" y="62" width="220" height="72" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><text x="400" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Threat of new entrants</text><text x="400" y="117" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">how easy to start up?</text>
<rect x="290" y="316" width="220" height="72" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/><text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Threat of substitutes</text><text x="400" y="371" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#64748B" text-anchor="middle">other ways to solve it</text>
<rect x="30" y="189" width="200" height="72" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.5"/><text x="130" y="223" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Supplier power</text><text x="130" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">can they squeeze you?</text>
<rect x="570" y="189" width="200" height="72" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/><text x="670" y="223" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Buyer power</text><text x="670" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#64748B" text-anchor="middle">can customers switch?</text>
<line x1="400" y1="136" x2="400" y2="164" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="400,176 393.4,164 406.6,164" fill="#334155" stroke="none" stroke-width="0"/>
<line x1="400" y1="314" x2="400" y2="286" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="400,274 406.6,286 393.4,286" fill="#334155" stroke="none" stroke-width="0"/>
<line x1="232" y1="225" x2="274" y2="225" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="286,225 274,231.6 274,218.4" fill="#334155" stroke="none" stroke-width="0"/>
<line x1="568" y1="225" x2="526" y2="225" stroke="#334155" stroke-width="3" stroke-linecap="round"/><polygon points="514,225 526,218.4 526,231.6" fill="#334155" stroke="none" stroke-width="0"/>
<text x="400" y="425" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="middle">The stronger the forces, the harder it is for anyone in the industry to make a profit.</text>
</svg>
